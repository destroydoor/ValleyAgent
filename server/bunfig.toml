[test]
coverage = true
# 实测（bun 1.3.11）：阈值按"单个文件"判定——任一文件的 funcs 或 lines 低于阈值即 exit 1，
# 与官方文档的"全局"口径不符，故 0.8 是很强的逐文件门禁。
coverageThreshold = 0.8
coverageSkipTestFiles = true
# 显式豁免清单 = 既有覆盖率欠账清单（阈值不为任何人降低，只豁免、不隐瞒）：
# - packages/core/src/llm-provider.ts：createModel/doCallWithTools 网络路径未测；R1（Director 工具脑）动此文件时补测并移出
# - packages/stardew/src/server.ts：启动/引导路径未测；补测后移出
coveragePathIgnorePatterns = ["**/packages/core/src/llm-provider.ts", "**/packages/stardew/src/server.ts"]
