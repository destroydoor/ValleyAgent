# 最小 CI（P0-S0a）。
#
# 背景：PR #2 曾在零 CI 状态下带着 tsc/编译错误开出 CLEAN，故先补防再犯基建。
# 覆盖：TS 四连（test / typecheck / check:protocol）+ 隐私扫描。
#
# matrix 含 windows-latest：专抓 EBUSY 类 Windows 文件锁缺陷（PR #2 实测踩过）。
# C# 不进 CI：UnitTests 经 ModBuildConfig 引用游戏 dll（$(GamePath)\smapi-internal），
# 游戏文件有版权不能上 runner；C# 验证走 scripts/verify-all.ps1（本地一键验收）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TS server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: server
        run: bun test

      - name: Typecheck
        working-directory: server
        run: bun run typecheck

      - name: Protocol contract
        working-directory: server
        run: bun run check:protocol

      - name: Privacy scan
        run: node scripts/check-privacy.mjs
