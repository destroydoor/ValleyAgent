# CI（P0-S0a 最小门禁 + C#/Docker 扩展）。
#
# 背景：PR #2 曾在零 CI 状态下带着 tsc/编译错误开出 CLEAN，故先补防再犯基建。
#
# 覆盖：
#   ts     — TS 四连（test / typecheck / check:protocol）+ 隐私扫描。
#   csharp — C# 单测在 docker/Dockerfile.unittests 容器内跑，解除 PR #3 的
#            "C# 不进 CI" 决策。原决策的障碍：UnitTests 经 ModBuildConfig
#            引用游戏 dll（$(GamePath)\smapi-internal），游戏文件有版权
#            不能进公开仓库，匿名 steamcmd 下载 413150 也不可行（付费
#            depot 报 No subscription）。
#            解除路径 = 私有镜像仓（取代 #6 的 Steam 凭据方案）：把本机
#            docker/linux-game（Linux depot，686MB）推到一个 **私有**
#            GitHub 仓库，CI 用只读 PAT 拉取，装 SMAPI 后以只读卷挂进
#            单测容器。版权文件仅存私有仓 + 用户自有 License 内的使用，
#            不构成对外分发；Steam 账号凭据不进 GitHub。
#   游戏内 IT / 联机 E2E（Dockerfile.gameit + compose）不进 CI：需真实 LLM
#   key、存档与多容器编排，继续走本地（scripts/test/run_farmhand_e2e.ps1）。
#
# Secrets（Settings → Secrets and variables → Actions 配齐后 csharp job 自动启用；
# 缺省时 job 跳过并留 notice，PR 保持绿）：
#   STARDW_GAME_REPO  私有游戏镜像仓全名，如 destroydoor/stardew-game-files
#   STARDW_GAME_PAT   只读访问该私有仓的 PAT（细粒度令牌：仅该仓库 +
#                     Contents: Read-only 即可）
#   一次性准备：跑 scripts/ci/push-game-files.ps1 建仓并推送游戏文件
#   （脚本输出 PAT 配置指引）。游戏更新后重跑一次即换新（单提交镜像，
#   仓库体积不膨胀；镜像仓 HEAD 即被测版本，无需缓存与版本探测）。
#
# matrix 含 windows-latest：专抓 EBUSY 类 Windows 文件锁缺陷（PR #2 实测踩过）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TS server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: server
        run: bun test

      - name: Typecheck
        working-directory: server
        run: bun run typecheck

      - name: Protocol contract
        working-directory: server
        run: bun run check:protocol

      - name: Privacy scan
        run: node scripts/check-privacy.mjs

  # secrets 上下文在 job 级 if 里不可用，先由本 job 侦察并输出开关。
  csharp-guard:
    name: C# CI gate (secrets present?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GAME_REPO: ${{ secrets.STARDW_GAME_REPO }}
          GAME_PAT: ${{ secrets.STARDW_GAME_PAT }}
        run: |
          if [ -n "$GAME_REPO" ] && [ -n "$GAME_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::C# 测试 job 已跳过：需配置 STARDW_GAME_REPO / STARDW_GAME_PAT secrets（准备步骤见 ci.yml 头部注释）"
          fi

  csharp:
    name: C# unit tests (Docker / linux)
    needs: csharp-guard
    if: needs.csharp-guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GAME_DIR: ${{ github.workspace }}/game-files
      SMAPI_VERSION: "4.3.2"
    steps:
      - uses: actions/checkout@v4

      # 只读 PAT 拉私有镜像仓；镜像仓内容即测试所针对的游戏版本，
      # 用户重推（push-game-files.ps1）即换新，无需缓存与版本探测。
      - name: Checkout game files (private mirror)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STARDW_GAME_REPO }}
          token: ${{ secrets.STARDW_GAME_PAT }}
          path: game-files

      # 镜像仓按设计存裸游戏文件（无 SMAPI）；已有 SMAPI 时跳过安装，两态都兼容。
      - name: Install SMAPI (skip if mirror already has it)
        run: |
          set -euo pipefail
          if [ -f "$GAME_DIR/smapi-internal/StardewModdingAPI.dll" ]; then
            echo "镜像仓已含 SMAPI，跳过安装"
          else
            curl -fsSL --retry 5 "https://github.com/Pathoschild/SMAPI/releases/download/${SMAPI_VERSION}/SMAPI-${SMAPI_VERSION}-installer.zip" -o /tmp/smapi.zip
            unzip -q /tmp/smapi.zip -d /tmp/smapi
            # 非交互安装（printf 应答安装器菜单，配方同 JunimoServer docker 构建）
            printf '2\n\n' | "/tmp/smapi/SMAPI ${SMAPI_VERSION} installer/internal/linux/SMAPI.Installer" --install --game-path "$GAME_DIR"
            rm -rf /tmp/smapi /tmp/smapi.zip
          fi
          test -f "$GAME_DIR/Stardew Valley.dll" || { echo "::error::游戏文件不完整（缺 Stardew Valley.dll），请重跑 scripts/ci/push-game-files.ps1"; exit 1; }
          test -f "$GAME_DIR/smapi-internal/SMAPI.Toolkit.dll" || { echo "::error::SMAPI 安装不完整（缺 smapi-internal/SMAPI.Toolkit.dll）"; exit 1; }

      - name: Build unit-test image
        run: docker build -f docker/Dockerfile.unittests -t valleyagent-unittests .

      - name: Run C# unit tests
        # --filter 与 scripts/verify-all.ps1 保持同一豁免清单：
        # ThinClient_MustWireChatBarRouter 是"房客聊天栏路由未接线"的产品缺陷守卫测试，
        # 修复后应与 verify-all 一并删除。
        run: |
          docker run --rm \
            -v "$GAME_DIR:/game:ro" \
            valleyagent-unittests \
            dotnet test src/ValleyAgent.UnitTests/ValleyAgent.UnitTests.csproj \
              -c Release \
              /p:EnableModDeploy=false \
              /p:EnableModZip=false \
              --filter "FullyQualifiedName!~ThinClient_MustWireChatBarRouter"
